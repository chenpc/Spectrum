[package]
name = "gyro-wrapper"
version = "0.1.0"
edition = "2024"

[lib]
name = "gyrocore_c"
crate-type = ["cdylib"]

[dependencies]
gyroflow-core = { git = "https://github.com/chenpc/gyroflow.git", branch = "master" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
